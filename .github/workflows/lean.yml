name: Lean dimension two

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: lean-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify source integrity
        run: |
          python verify_package.py
          # A setup failure must not upload the committed example as a fresh log.
          rm -- lean/lean-check.log
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596
        with:
          lake-package-directory: lean
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-mathlib-cache: "false"
          use-github-cache: "false"
      - name: Fetch pinned dependencies and selected compiled imports
        working-directory: lean
        run: |
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
          python3 cache_imports.py
      - name: Recompile dimension-two theorems and audit axioms
        working-directory: lean
        run: |
          bash verify.sh
          git diff --exit-code -- lean-toolchain lakefile.toml lake-manifest.json
      - name: Upload Lean verification log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-dimension-two
          retention-days: 14
          if-no-files-found: warn
          path: |
            lean/lean-check.log
            lean/lake-manifest.json
