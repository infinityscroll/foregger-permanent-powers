name: Exact diagnostics

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: exact-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      PYTHON: python
      CXX: g++
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev
      - name: Verify working and original archive integrity
        run: |
          python verify_package.py
          python scripts/verify_original_archive.py
      - name: Reproduce supplied exact diagnostics
        run: bash reproduce.sh build/reproduced
      - name: Test independent implementation
        run: |
          python -m unittest discover -s independent -v 2>&1 | tee build/independent-tests.log
          python -O -m unittest discover -s independent -v 2>&1 | tee build/independent-tests-optimized.log
      - name: Reproduce independent exact report
        run: |
          python independent/verify.py --output build/independent.json
          diff -u independent/reference/diagnostics.json build/independent.json
          python -O independent/verify.py --output build/independent-optimized.json
          diff -u independent/reference/diagnostics.json build/independent-optimized.json
      - name: Check hardened validation
        run: |
          python tests/hardening_regressions.py --cpp build/reproduced/build/audit_cpp --output build/hardening-regressions.json
          diff -u docs/evidence/hardening-regressions.json build/hardening-regressions.json
      - name: Check malformed inputs with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          g++ -O1 -g -std=c++17 -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=all src/audit_cpp.cpp -o build/audit_cpp_sanitized
          python tests/hardening_regressions.py --cpp build/audit_cpp_sanitized --output build/hardening-regressions-sanitized.json
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-python-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/*.json
            build/*.log
            build/reproduced/reproduction_comparison.json
            build/reproduced/build/*.log
            build/reproduced/outputs/*.json
